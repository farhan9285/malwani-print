name: Unzip and Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip Project
        run: unzip -o aapki-file.zip -d extracted_app
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Build Debug APK
        working-directory: ./extracted_app
        run: |
          sed -i '/debugConfig/d' app/build.gradle.kts
          chmod +x gradlew
          ./gradlew assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: malwani-print-apk
          path: extracted_app/app/build/outputs/apk/debug/app-debug.apk
